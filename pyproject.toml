[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osupp"
version = "0.1"
dependencies = [
    "orjson",
    "pytest",
    "pythonnet",
    "stubgen @ https://github.com/Mimer29or40/pythonnet-stubs/releases/download/v2.1.0/stubgen-2.1.0-py3-none-any.whl",
]
requires-python = ">=3.12"
authors = [
    { name = "bobbycyl", email = "bobbycyl@126.com" },
]
description = "A simple wrapper for osu-tools"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: C#",
]

[project.urls]
Repository = "https://github.com/bobbycyl/osupp.git"
"Bug Tracker" = "https://github.com/bobbycyl/osupp/issues"

[tool.hatch.metadata]
allow-direct-references = true
